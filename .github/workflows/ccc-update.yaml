name: Update ContextCodeCache

# keeps the committed `.ccc/` in sync with the source 
# and opens a pull request authored by ContextCodeCache-Bot if changed

on:
  push:
    branches: [main]
    # Only source that `ccc` scans (and the generator itself) can change output.
    paths:
      - '**/*.rs'
      - '**/*.py'
      - '**/*.pyi'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.tsx'
      - '**/*.go'
      - '**/*.cpp'
      - '**/*.cc'
      - '**/*.cxx'
      - '**/*.hpp'
      - '**/*.hh'
      - '**/*.hxx'
      - '**/*.h'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ccc-update.yaml'
  workflow_dispatch:        # allow a manual refresh
  schedule:
    - cron: '0 6 * * 1'     # Mondays 06:00 UTC — safety net in case a push slips through

permissions:
  contents: write           # push the ContextCodeCache-Bot branch
  pull-requests: write      # open / update the PR

concurrency:
  group: ccc-update-${{ github.ref }}
  cancel-in-progress: true

env:
  # Project roots whose `.ccc/` this repo commits. Edit this list to match your
  # layout (space-separated).
  CCC_ROOTS: '.'

jobs:
  update-ccc:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
      changed_files: ${{ steps.check.outputs.changed_files }}
      changed_count: ${{ steps.check.outputs.changed_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build ccc
        run: cargo build --release --locked

      # Does the cache need updating? `ccc check --format json` ignores
      # generation timestamps, so a root is stale only when real content drifted.
      # Outputs:
      #   stale         - 'true'/'false'
      #   changed_files - JSON array of repo-relative changed cache paths
      #   changed_count - number of changed cache files
      - name: Check ContextCodeCache freshness
        id: check
        run: |
          stale=false
          files='[]'
          echo "## ContextCodeCache freshness" >> "$GITHUB_STEP_SUMMARY"
          for root in $CCC_ROOTS; do
            json="$(./target/release/ccc check --format json "$root" || true)"
            [ "$(jq -r '.up_to_date' <<<"$json")" = "true" ] || stale=true
            files="$(jq -cn --argjson a "$files" --argjson b "$(jq -c '.files' <<<"$json")" '$a + $b')"
            jq -r '.changes[]? | "- `\(.path)` (\(.status))"' <<<"$json" >> "$GITHUB_STEP_SUMMARY"
          done
          files="$(jq -c 'unique' <<<"$files")"
          echo "stale=$stale"                      >> "$GITHUB_OUTPUT"
          echo "changed_files=$files"              >> "$GITHUB_OUTPUT"
          echo "changed_count=$(jq 'length' <<<"$files")" >> "$GITHUB_OUTPUT"
          [ "$stale" = true ] || echo "Up to date — no PR needed." >> "$GITHUB_STEP_SUMMARY"

      # Regenerate every root (markdown + token stream) when stale.
      - name: Regenerate ContextCodeCache
        if: steps.check.outputs.stale == 'true'
        run: |
          for root in $CCC_ROOTS; do
            ./target/release/ccc scan --tokens "$root"
          done

      - name: Open pull request from ContextCodeCache-Bot
        if: steps.check.outputs.stale == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # For the PR to be *opened by* a real "ContextCodeCache-Bot" account
          # token: ${{ secrets.CCC_BOT_TOKEN }}
          branch: ContextCodeCache-Bot/update-cache
          delete-branch: true
          author: 'ContextCodeCache-Bot <ContextCodeCache-Bot@users.noreply.github.com>'
          committer: 'ContextCodeCache-Bot <ContextCodeCache-Bot@users.noreply.github.com>'
          commit-message: 'chore(ccc): regenerate ContextCodeCache'
          title: 'chore(ccc): refresh ContextCodeCache'
          body: |
            Automated refresh of the ContextCodeCache (`.ccc/`).

            Regenerated by `ccc scan --tokens` from ${{ github.sha }}.

            Roots: `${{ env.CCC_ROOTS }}`
            Changed cache entries: ${{ steps.check.outputs.changed_count }}

            > Do not hand-edit `.ccc/` — this PR is produced by the generator.
            > Header timestamps update on every regeneration; `ccc check` ignores
            > them, so the only meaningful changes here are to the cache content.
          # Only commit the generated cache — never build artifacts.
          add-paths: |
            .ccc

  # Example: consume the changed-cache array in a separate job
  consume-changes:
    needs: update-ccc
    if: needs.update-ccc.outputs.stale == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.update-ccc.outputs.changed_files) }}
    steps:
      - name: Handle changed cache file
        run: echo "changed cache entry -> ${{ matrix.file }}"
