name: Surf changed services

# Example continuous-testing wiring for `ccc surf` (see docs/SURF.md).
# On every PR it diffs the branch against the target branch, works out which
# services changed and which services call them, then fans a test job out per
# impacted service. Replace the test step's `run:` with your real entrypoint.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ccc-surf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surf:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.surf.outputs.services }}
      any: ${{ steps.surf.outputs.any }}
      untested: ${{ steps.surf.outputs.untested }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # REQUIRED: surf diffs against the merge-base with the target branch;
          # a shallow clone has no merge-base.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build ccc
        run: cargo build --release --locked

      # Outputs:
      #   services - JSON array of services to test (changed + their callers)
      #   any      - 'true' when that array is non-empty
      #   untested - number of changed functions with no detected test reference
      - name: Surf the diff
        id: surf
        run: |
          report="$(./target/release/ccc surf --base "origin/${{ github.base_ref }}")"
          {
            echo "## ccc surf"
            echo '```json'
            jq . <<<"$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "services=$(jq -c '.services_to_test' <<<"$report")" >> "$GITHUB_OUTPUT"
          echo "any=$(jq '.counts.services_to_test > 0' <<<"$report")"  >> "$GITHUB_OUTPUT"
          echo "untested=$(jq '.counts.untested' <<<"$report")"         >> "$GITHUB_OUTPUT"

  # One test leg per impacted service. Replace the run step with your suite
  # (cargo test -p, npm --workspace, go test ./..., a Make target, ...).
  test:
    needs: surf
    if: needs.surf.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.surf.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test ${{ matrix.service }}
        run: echo "run the '${{ matrix.service }}' test suite here"

  # Optional gate: fail the PR when changed functions have no detected test
  # reference. Drop this job (or make it non-required) if you only want the
  # signal, not the enforcement.
  untested-gate:
    needs: surf
    if: needs.surf.outputs.untested != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Report untested changes
        run: |
          echo "::warning::${{ needs.surf.outputs.untested }} changed function(s) have no detected test reference (see the surf job summary)"
